<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Carne congelada">
  <defs>
    <linearGradient id="base" gradientTransform="rotate(75)">
      <stop offset="0%" stop-color="rgb(21,18,13)"/>
      <stop offset="100%" stop-color="rgb(10,7,1)"/>
    </linearGradient>
    <radialGradient id="foco" cx="50%" cy="46%" r="78%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="grao">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#base)"/>
  <rect width="1200" height="900" fill="url(#foco)"/>
  <rect width="1200" height="900" filter="url(#grao)" opacity=".05"/>

  <rect x=".5" y=".5" width="1199" height="899" fill="none"
        stroke="#f0e9dd" stroke-opacity=".14"/>

  <g fill="#f0e9dd" fill-opacity=".42"
     font-family="'Space Grotesk',system-ui,sans-serif" font-size="23"
     font-weight="500" letter-spacing="5.1"
     text-anchor="middle">
    <text x="600" y="457.6666666666667">CARNE CONGELADA</text>
  </g>
</svg>
